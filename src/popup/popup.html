<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TipMNEE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      width: 250px;
      padding: 16px;
      margin: 0;
      background-color: #fcfcfc;
      color: #1a1a1a;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
      background: linear-gradient(135deg, #FF0000 0%, #B30000 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }
    .subtitle { margin: 2px 0 20px; font-size: 11px; color: #888; font-weight: 500; }
    
    .btn-primary {
      background: #065fd4;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    .btn-primary:active { opacity: 0.8; }
    
    .btn-secondary {
      background: transparent;
      color: #666;
      border: 1px solid #ddd;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
      margin-top: 12px;
    }

    .user-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      width: 100%;
      margin-bottom: 20px;
      border: 1px solid #f0f0f0;
    }
    .card-label { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
    .earnings-amount { font-size: 32px; margin: 4px 0 16px; color: #065fd4; font-weight: 800; }
    
    .stats-row { display: flex; justify-content: center; gap: 24px; border-top: 1px solid #f5f5f5; padding-top: 12px; }
    .stat-item { display: flex; flex-direction: column; align-items: center; }
    .stat-label { font-size: 9px; color: #aaa; font-weight: 600; }
    .stat-value { font-size: 13px; font-weight: 700; color: #333; }

    .dashboard-actions { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .btn-claim { background: #1a1a1a; font-size: 12px; }
    .btn-withdraw { background: #065fd4; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .btn-withdraw:active { opacity: 0.8; }
    .btn-withdraw:disabled { background: #eee; color: #999; cursor: not-allowed; }

    footer { margin-top: 24px; font-size: 11px; }
    footer a { color: #065fd4; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>TipMNEE</h1>
      <p class="subtitle">Creator Economy Platform</p>
    </header>

    <div id="login-view">
      <button id="auth-button" class="btn-primary">Connect Wallet</button>
      <p style="font-size: 11px; color: #999; margin-top: 12px;">Web3 Authentication Required</p>
    </div>

    <div id="dashboard-view" style="display: none;">
      <div class="user-card">
        <p class="card-label">Total Earned</p>
        <h2 id="total-earned-display" class="earnings-amount">$0.00</h2>
        <div class="stats-row">
          <div class="stat-item">
            <span class="stat-label">PENDING</span>
            <span id="pending-display" class="stat-value">$0.00</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">WITHDRAWN</span>
            <span id="withdrawn-display" class="stat-value">$0.00</span>
          </div>
        </div>
        <div id="connected-channel-container" style="display: none; margin-top: 16px; border-top: 1px solid #f5f5f5; padding-top: 12px;">
          <p class="card-label">Linked YouTube</p>
          <p id="connected-channel-display" style="font-size: 11px; color: #666; font-weight: 600; margin: 4px 0 0; overflow: hidden; text-overflow: ellipsis;"></p>
        </div>
      </div>
      
      <div class="dashboard-actions">
        <button id="claim-button" class="btn-primary btn-claim">Claim YouTube Channel</button>
        <button id="withdraw-button" class="btn-withdraw">Withdraw Funds</button>
        <button id="logout-button" class="btn-secondary">Disconnect</button>
      </div>
    </div>

    <footer>
      <a href="https://tipmnee.com/help" target="_blank">Documentation & Support</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
